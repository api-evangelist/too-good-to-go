aid: too-good-to-go
name: Too Good To Go
description: >-
  Too Good To Go is a Danish certified B Corporation, founded in Copenhagen in 2015, that
  operates the world's largest marketplace for surplus food. Consumers use its mobile app to
  buy discounted "Surprise Bags" of unsold food from bakeries, restaurants, supermarkets and
  hotels near closing time, and partner businesses list that surplus through the MyStore
  partner portal at store.toogoodtogo.com. Alongside the consumer marketplace the company
  sells Too Good To Go Platform, a modular AI-assisted surplus-management product for grocery
  retailers that tracks near-expiry inventory, sets automated markdowns, routes unsold stock
  to charity and pushes the remainder onto the marketplace. It also runs the Look-Smell-Taste
  date-label campaign and Too Good To Go Parcels. Too Good To Go publishes no public API,
  developer portal, or machine-readable contract: its developer subdomain answers 401 behind
  a JumpCloud SSO login, and the live backends at api.toogoodtogo.com and apptoogoodtogo.com
  serve only the mobile app and the partner portal.
