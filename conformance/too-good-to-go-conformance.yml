- id: graphql
  name: GraphQL
  conforms: false
  evidence: /graphql returns 404 application/problem+json on both API hosts.
- id: json-api
  name: JSON:API
  conforms: false
  evidence: Observed error and response envelopes do not use the JSON:API media type or document structure.
- id: a2a
  name: A2A Agent Card
  conforms: false
  evidence: >-
    /.well-known/agent-card.json and /.well-known/agent.json return 404 on both API hosts and
    302 (locale catch-all) on both marketing hosts.
domain_standards:
  assessed: true
  standards_found: []
  note: >-
    Food-surplus / food-donation marketplaces have no widely adopted machine-readable domain
    standard analogous to FHIR or ISO 20022. GS1 identifiers (GTIN) and food-donation data
    schemas would be the candidates for Too Good To Go Platform's retailer integrations, but
    no contract is published in which such a signature could be observed. Recorded as
    not-assessable rather than absent — this is a reward-only dimension and nothing is
    invented to fill it.
