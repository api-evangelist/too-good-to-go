name: Too Good To Go standards conformance
description: >-
  Too Good To Go publishes no machine-readable contract, so most contract-level standards
  cannot be assessed. Two things ARE observable: its live backends emit RFC 9457
  problem+json error bodies, and its trust center names two security/compliance
  certifications. Everything else below is recorded as not-conformant or unknown with the
  reason, not asserted.
conformance:
- id: rfc9457
  name: RFC 9457 Problem Details for HTTP APIs
  conforms: true
  evidence: >-
    GET https://api.toogoodtogo.com/openapi.json returned 404 with
    content-type application/problem+json and body
    {"detail":"No static resource openapi.json.","instance":"/openapi.json","status":404,"title":"Not Found"}.
    The same shape is returned by apptoogoodtogo.com. Members detail/instance/status/title
    are the RFC 9457 registered members.
  note: >-
    Conformance is observed on the framework-level 404 handler. The application-level error
    surface uses a DIFFERENT, non-RFC envelope (see errors/too-good-to-go-problem-types.yml),
    so this is partial conformance at the transport edge, not a published commitment.
- id: soc2
  name: SOC 2 Type 2
  conforms: true
  evidence: 'https://trust.toogoodtogo.com/ — listed as a held certification with a gated report.'
- id: pci-dss
  name: PCI DSS v4.0.1
  conforms: true
  evidence: 'https://trust.toogoodtogo.com/ — listed as a held certification with a gated report.'
- id: gdpr
  name: GDPR (EU 2016/679)
  conforms: true
  evidence: >-
    EU-headquartered controller (Copenhagen, Denmark) operating a data-subject rights portal
    at https://space.toogoodtogo.com/privacy (HTTP 200) and publishing a privacy policy.
  note: Regime applicability, not a certification.
- id: rfc9116
  name: RFC 9116 security.txt
  conforms: false
  evidence: >-
    https://www.toogoodtogo.com/.well-known/security.txt returns 200 with a Contact field but
