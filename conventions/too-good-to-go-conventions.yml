reversibility:
  grade: none
  state: undocumented
  write_surface: private
  reversal_operations: []
  note: >-
    Too Good To Go plainly HAS reversible write actions — a consumer can cancel a Surprise
    Bag reservation in the app, and refunds are handled through support — but not one of them
    is exposed as a documented operation, and no cancellation or refund WINDOW is stated on
    any public Too Good To Go surface. Grade is `none` rather than `na`: this is not a
