name: Too Good To Go API conventions
description: >-
  Too Good To Go publishes no API documentation, so almost every cross-cutting convention
  below is `undocumented` rather than absent — the behaviour may well exist inside the
  private app/partner backend, but nothing about it is stated publicly and none of it can be
  relied on by an integrator. The three entries that are NOT unknown were observed directly
  on live unauthenticated responses.
auth:
